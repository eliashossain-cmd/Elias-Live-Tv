name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Determine Version Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building release for tag: $TAG"

      - name: Configure Keystore Signing (If Secrets Provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Signing secrets detected. Decoding keystore..."
            mkdir -p ${{ runner.temp }}/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/keystore/release.jks
            echo "KEYSTORE_PATH=${{ runner.temp }}/keystore/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "is_signed=true" >> $GITHUB_OUTPUT
          else
            echo "No custom keystore secrets provided. Proceeding with standard build."
            echo "is_signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build APK
        run: |
          if [ "${{ steps.keystore.outputs.is_signed }}" = "true" ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Building APK for release distribution..."
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Prepare Release Artifact
        id: prepare_artifact
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OUTPUT_APK="Elias-Live-TV-${TAG}.apk"

          # Search for release APK first, then debug APK as fallback
          FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi

          echo "Found source APK: $FOUND_APK"
          cp "$FOUND_APK" "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK" > "${OUTPUT_APK}.sha256"

          echo "apk_file=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "checksum_file=${OUTPUT_APK}.sha256" >> $GITHUB_OUTPUT

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -rf ${{ runner.temp }}/keystore

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Elias Live TV ${{ steps.version.outputs.tag }}"
          body: |
            ### Elias Live TV ${{ steps.version.outputs.tag }}
            
            Welcome to the official release of **Elias Live TV**!

            #### Key Features:
            - **M3U / M3U8 Playlist Import**: Fast background parser supporting EXTINF metadata, channel logos (`tvg-logo`), groups (`group-title`), and stream URLs.
            - **AndroidX Media3 ExoPlayer**: Smooth HLS (`.m3u8`) and HTTP/HTTPS live video playback.
            - **Rich Channel Browsing**: Grid and List view layouts with search and category filters.
            - **Favorites & Watch History**: Keep your top channels one tap away.
            - **Safe Local Storage**: Stored securely on your device with Room Database; no third-party cloud uploads.
            - **Storage Access Framework**: Open local playlist files securely without intrusive storage permissions.

            #### Download Instructions:
            1. Download `${{ steps.prepare_artifact.outputs.apk_file }}` below.
            2. On your Android phone or TV box, tap the file to install (allow "Install unknown apps" if prompted).
            3. Open **Elias Live TV** and tap **Import Playlist** or load the included free public channels.

            ---
            *This App Develop by Elias Hossain.*
          files: |
            ${{ steps.prepare_artifact.outputs.apk_file }}
            ${{ steps.prepare_artifact.outputs.checksum_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
